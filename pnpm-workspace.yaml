packages:
  - .
storeDir: .local/pnpm-store
strictPeerDependencies: true
overrides:
  # Vite is used by Vitest only; 8.2.4 fixes the bundled launch-editor advisories.
  vite: 8.2.4
  # Compatible patches for validation and URI tooling advisories.
  zod@4.5.4: 4.6.6
  fast-uri@3.1.8: 3.1.9
  # Keep the existing compatible security fixes.
  minimatch@10.2.6>brace-expansion: 5.0.12
  # This single-root lint plugin uses the pinned Node glob API instead.
  '@next/eslint-plugin-next@16.4.1>fast-glob': '-'
patchedDependencies:
  '@next/eslint-plugin-next@16.4.1': patches/@next__eslint-plugin-next@16.4.1.patch
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
