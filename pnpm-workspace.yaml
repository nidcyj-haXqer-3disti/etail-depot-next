packages:
  - .
storeDir: .local/pnpm-store
strictPeerDependencies: true
overrides:
  # Vite is used by Vitest only; 8.2.4 fixes the bundled launch-editor advisories.
  vite: 8.2.4
  # Keep the existing compatible security fixes.
  fast-uri@4.1.4: 4.1.5
  minimatch@10.2.6>brace-expansion: 5.0.12
  # This single-root lint plugin uses the pinned Node glob API instead.
  '@next/eslint-plugin-next@16.3.8>fast-glob': '-'
patchedDependencies:
  '@next/eslint-plugin-next@16.3.8': patches/@next__eslint-plugin-next@16.3.8.patch
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
