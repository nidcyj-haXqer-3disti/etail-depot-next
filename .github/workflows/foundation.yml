name: Public website checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      APP_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Pinned, previously verified official action revisions. No release credentials.
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nidcyj-haXqer-3disti/etail-depot-next
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Set up pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.19.0
          install: false
          cache: false
      - name: Verify repository and runtime binding
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const targets = JSON.parse(readFileSync('project-targets.json', 'utf8'));
          assert.equal(process.env.GITHUB_REPOSITORY, 'nidcyj-haXqer-3disti/etail-depot-next');
          assert.equal(String(targets.github.repository_id), process.env.GITHUB_REPOSITORY_ID);
          assert.equal(targets.release.real_money_allowed, false);
          assert.equal(process.version, 'v24.19.0');
          assert.equal(execFileSync('pnpm', ['--version'], { encoding: 'utf8' }).trim(), '11.19.0');
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), process.env.GITHUB_SHA);
          console.log('Exact repository, commit, runtime and disabled financial-release boundary verified.');
          NODE
      - name: Install the exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify the public website
        run: pnpm verify:public
      - name: Verify and build the isolated Guides review
        run: |
          node --test tools/guide-review/preview-assets.test.mjs
          node tools/guide-review/build.mjs --check
          node tools/guide-review/build.mjs
      - name: Verify the approved production search release
        run: pnpm test:seo:production
      - name: Package for the bound Netlify site without publishing
        run: pnpm package:netlify
      - name: Verify deployment route and file boundaries
        run: pnpm verify:package
