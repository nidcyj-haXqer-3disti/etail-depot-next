name: Delivery task
description: A scoped Etail Depot Next implementation task
title: "[EDN-XXX] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and source
      description: User requirement, affected public pages and approved service destinations.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Area and files
      description: Name the owning website feature or engineering files and any shared-file coordination. Contributor management is separate from the public Developers section.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and boundaries
      description: Expected behavior, preserved content, accessibility and privacy impact. No local account or financial backend.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence needed
      description: Relevant browser and accessibility checks, exact commit, deployment-package review and any vendor checks not performed.
    validations:
      required: true
