[build]
  # Publication stays manual and reviewed; build hooks must not bypass this hold.
  ignore = "exit 0"
  command = "pnpm build && node tools/package-public-site.mjs"
  publish = ".netlify/static"

[build.environment]
NODE_VERSION = "24.19.0"
PNPM_VERSION = "11.19.0"
# Static export does not require the Next server adapter.
NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Preserve the enabled platform integration, using the reviewed locked version.
# The second plugin protects its generated handler and checks the final bundle.
[[plugins]]
package = "@netlify/plugin-emails"

[[plugins]]
package = "./netlify/plugins/public-release"

[functions.emails]
node_bundler = "esbuild"

# D122/D215: only this approved production site and its new canonical domain may be indexed.
# The edge boundary checks trusted site/deploy context and scoped runtime markers again.
[context.production.environment]
APP_ENV = "production"
ETAIL_SEARCH_CONTEXT = "production"
ETAIL_PUBLIC_ORIGIN = "https://etaildepot.com"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "no-referrer"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
