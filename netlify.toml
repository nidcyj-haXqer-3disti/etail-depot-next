[build]
  # Public-only website. Keep automatic publication off pending reviewed release.
  # Netlify build hooks bypass ignore; do not configure unattended release hooks.
  ignore = "exit 0"
command = "pnpm build"
publish = ".next"

[build.environment]
NODE_VERSION = "24.19.0"
PNPM_VERSION = "11.19.0"

# D122: search launch for this exact production site. Preview contexts stay excluded.
# Matching production-only Functions values are configured through the Netlify API;
# netlify.toml environment settings apply to builds, not function runtime.
[context.production.environment]
APP_ENV = "production"
ETAIL_SEARCH_CONTEXT = "production"
ETAIL_PUBLIC_ORIGIN = "https://etail-depot-next.netlify.app"

[functions]
node_bundler = "esbuild"

# Modern OpenNext adapter, resolved and pinned in the application lockfile.
# This also makes local packaging independent of Netlify's plugin auto-installer.
[[plugins]]
package = "@netlify/plugin-nextjs"
